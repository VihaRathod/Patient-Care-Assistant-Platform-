AWSTemplateFormatVersion: "2010-09-09"
Description: Private, encrypted S3 storage for Patient Care generated documents.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name.

Resources:
  PatientDocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

Outputs:
  DocumentsBucketName:
    Description: Configure this as DOCUMENTS_S3_BUCKET.
    Value: !Ref PatientDocumentsBucket
  DocumentsBucketArn:
    Description: Grant the application role access to this private bucket only.
    Value: !GetAtt PatientDocumentsBucket.Arn
